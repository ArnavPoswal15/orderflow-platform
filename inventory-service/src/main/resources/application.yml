spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${INVENTORY_DB:inventory}
    username: ${POSTGRES_USER:shop}
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: inventory-service
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

outbox:
  poll-interval-ms: 200

shop:
  metrics:
    initial-delay-ms: 120000
    refresh-ms: 15000

logging:
  config: classpath:logback-spring.xml
