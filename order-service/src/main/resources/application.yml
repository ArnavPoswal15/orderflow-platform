spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${ORDERS_DB:orders}
    username: ${POSTGRES_USER:shop}
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

server:
  port: ${SERVER_PORT:8080}

inventory:
  base-url: ${INVENTORY_SERVICE_URL:http://localhost:8081}

payment:
  base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

outbox:
  poll-interval-ms: 200

order:
  rate-limit:
    limit-per-minute: 20
    window-seconds: 60

shop:
  instance-id: ${HOSTNAME:local}
  sse:
    consumer-group: sse-feed-${shop.instance-id}
  metrics:
    initial-delay-ms: 120000
    refresh-ms: 15000
  kafka:
    listeners:
      enabled: true

logging:
  config: classpath:logback-spring.xml
