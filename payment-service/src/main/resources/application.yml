spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PAYMENTS_DB:payments}
    username: ${POSTGRES_USER:shop}
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

payment:
  failure-rate-percent: ${PAYMENT_FAILURE_RATE:0}

outbox:
  poll-interval-ms: 200

shop:
  metrics:
    initial-delay-ms: 120000
    refresh-ms: 15000

logging:
  config: classpath:logback-spring.xml
