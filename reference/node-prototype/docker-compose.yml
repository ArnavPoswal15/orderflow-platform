services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: orders }
    volumes: ["./schema.sql:/docker-entrypoint-initdb.d/schema.sql"]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }
  app:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/orders
      REDIS_URL: redis://redis:6379
      SERVICES: api,order,inventory,payment   # split into separate containers by changing this
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
